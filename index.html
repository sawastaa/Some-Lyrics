<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spotify Lyrics Visualizer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="login-screen">
    <div class="login-card">
      <h1>Spotify Lyrics Visualizer</h1>
      <p>Login pakai akun Spotify kamu buat mulai nge-track lagu yang lagi diputar.</p>
      <button id="login-btn">Login dengan Spotify</button>
      <p class="hint">Aplikasi ini cuma minta izin baca lagu yang sedang diputar,
        tidak bisa kontrol atau ubah apapun di akun kamu.</p>
    </div>
  </div>

  <canvas id="visualizer"></canvas>

  <script src="app.js"></script>
</body>
</html>
